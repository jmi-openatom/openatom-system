<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">步骤 13：在 QQ 入群申请中填写验证码</title><desc id="desc">打开 QQ，搜索刚才的群号并申请加入，将验证码填入申请验证信息。QQ 客户端版本的界面可能不同，图中只演示填写关系。 完成后：入群申请已提交，等待审核与系统识别。。蓝框标出本步操作区域。本图为使用演示数据渲染的界面演示，非线上截图。</desc><rect width="1200" height="800" fill="#f5f5f7"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="31" y="30" font-size="12" fill="#6e6e73" font-weight="600">社团账号激活 / STEP 13</text><text x="31" y="58" font-size="22" fill="#1d1d1f" font-weight="600">在 QQ 入群申请中填写验证码</text><text x="961" y="41" font-size="12" fill="#6e6e73" font-weight="400">界面演示 · 非线上截图</text><rect x="30" y="77" width="1140" height="594" rx="8" fill="#fff" stroke="#dedee3"/><rect x="31" y="78" width="1138" height="33" rx="8" fill="#fafafa" stroke="#dedee3"/><text x="51" y="100" font-size="12" fill="#6e6e73" font-weight="400">QQ 客户端 · 入群申请关系示意（版本不同可能有差异）</text><text x="1021" y="100" font-size="11" fill="#6e6e73" font-weight="400">演示数据</text><g clip-path="url(#screen)"><text x="300" y="237" font-size="29" fill="#1d1d1f" font-weight="600">QQ 入群申请</text><text x="300" y="275" font-size="15" fill="#6e6e73" font-weight="400">客户端版本不同，请以实际申请界面为准。</text><rect x="300" y="306" width="600" height="293" rx="8" fill="#fafafa" stroke="#dedee3"/><text x="326" y="350" font-size="23" fill="#1d1d1f" font-weight="600">申请加入社团 QQ 群</text><text x="326" y="408" font-size="14" fill="#6e6e73" font-weight="400">申请验证信息</text><rect x="326" y="420" width="547" height="66" rx="6" fill="#fafafa" stroke="#dedee3"/><text x="340" y="448" font-size="16" fill="#1d1d1f" font-weight="400">粘贴激活页生成的个人验证码</text><rect x="326" y="533" width="547" height="42" rx="6" fill="#1d1d1f" stroke="#dedee3"/><text x="342" y="561" font-size="16" fill="#fff" font-weight="600">提交入群申请（位置示意）</text><rect x="321" y="415" width="557" height="76" rx="8" fill="none" stroke="#0066cc" stroke-width="3"/><circle cx="329" cy="423" r="15" fill="#0066cc" stroke="#fff" stroke-width="2"/><text x="324" y="428" font-size="15" fill="#fff" font-weight="600">→</text><path d="m855 479 0 27 7-7 6 12 6-3-6-12 10-1Z" fill="#0066cc" stroke="#fff" stroke-width="2"/></g><text x="33" y="711" font-size="13" fill="#0066cc" font-weight="600">蓝色标注 = 本步操作位置</text><text x="33" y="747" font-size="12" fill="#6e6e73" font-weight="600">完成后</text><text x="111" y="747" font-size="16" fill="#1d1d1f" font-weight="400">入群申请已提交，等待审核与系统识别。</text><text x="33" y="783" font-size="12" fill="#6e6e73" font-weight="400">按自己的实际账号与页面操作；图中的示例账号、地址与标记不能用于真实提交。</text></g><defs><clipPath id="screen"><rect x="31" y="111" width="1138" height="558"/></clipPath></defs></svg>