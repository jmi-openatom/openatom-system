# Standalone HTTP example. In BT Panel, use a normal static site with this root,
# then enable HTTPS through the panel. Do not add a duplicate server block there.
server {
    listen 80;
    server_name guide.jmi-openatom.cn;
    root /www/wwwroot/openatom-member-guide/current;
    index index.html;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # Hash routes are handled in the browser; missing static files stay 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}
