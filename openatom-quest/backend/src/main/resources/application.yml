server:
  port: ${QUEST_SERVER_PORT:8931}
  servlet:
    session:
      cookie:
        name: QUEST_SESSION
        http-only: true
        secure: ${QUEST_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: openatom-quest
  datasource:
    url: ${QUEST_DB_URL:jdbc:mysql://localhost:3306/quest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${QUEST_DB_USERNAME:root}
    password: ${QUEST_DB_PASSWORD:ab321818}
  data:
    redis:
      host: ${QUEST_REDIS_HOST:localhost}
      port: ${QUEST_REDIS_PORT:6379}
      password: ${QUEST_REDIS_PASSWORD:}
  session:
    store-type: redis
    timeout: 8h
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

quest:
  frontend-url: ${QUEST_FRONTEND_URL:http://localhost:5174}
  oauth:
    issuer: ${QUEST_OAUTH_ISSUER:https://oauth.jmi-openatom.cn/api/v1}
    client-id: ${QUEST_OAUTH_CLIENT_ID:openatom-quest}
    client-secret: ${QUEST_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${QUEST_OAUTH_REDIRECT_URI:http://localhost:8931/api/auth/callback}
    scopes: ${QUEST_OAUTH_SCOPES:openid profile email}
    bootstrap-admin-subjects: ${QUEST_OAUTH_BOOTSTRAP_ADMIN_SUBJECTS:}
