name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/web_pc/pnpm-lock.yaml
            frontend/uni_app/pnpm-lock.yaml
      - name: Frontend Build Check
        run: |
          cd frontend/web_pc
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
      - name: UniApp Type Check
        run: |
          cd frontend/uni_app
          pnpm install --frozen-lockfile
          pnpm run typecheck

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Validate Flyway migration versions
        run: backend/scripts/check-flyway-migrations.sh
      - name: Backend Build Check
        run: |
          cd backend
          ./mvnw -q -DskipTests compile
          ./mvnw -q -DskipTests=false \
            -Dtest=AuthServiceImplTest,OidcServiceImplTest,OidcSigningKeyProviderTest,OAuthSessionCookieServiceTest,MailboxProvisioningClientTest,MailboxOutboxSchedulerTest,SeafileOauthClientInitializerTest \
            test

  bot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: AstrBot Plugin & MCP Server Syntax Check
        run: |
          python -m py_compile astrbot/data/plugins/astrbot_plugin_openatom_api/main.py
          python -m py_compile astrbot/data/mcp_servers/openatom_backend/main.py
          python -c "import json; json.load(open('astrbot/data/mcp_server.json')); print('mcp_server.json: valid')"

  deploy:
    needs: [ frontend-check, backend-check, bot-check ]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: SERVER
    concurrency:
      group: openatom-main-production-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -eu
            cd /www/wwwroot/openatom-system || { echo "Directory not found"; exit 1; }
            
            git fetch --all
            git reset --hard origin/main
            
            # 兼容性处理
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi

            # --- 关键修改：先创建 .env 文件，再执行 docker-compose 命令 ---
            echo "Step 1: Creating .env file from GitHub Secrets..."

            # Seafile 与身份中心共享的 OAuth client secret 只在服务器生成一次。
            # 独立持久化可避免项目 .env 重建或两个部署工作流先后执行时发生密钥漂移。
            SHARED_SECRET_DIR="${{ vars.OPENATOM_SHARED_SECRET_DIR || '/www/wwwroot/.openatom-secrets' }}"
            SEAFILE_OAUTH_SECRET_FILE="$SHARED_SECRET_DIR/seafile-oauth-client-secret"
            mkdir -p "$SHARED_SECRET_DIR"
            chmod 700 "$SHARED_SECRET_DIR"
            if [ ! -e "$SEAFILE_OAUTH_SECRET_FILE" ]; then
              umask 077
              TEMP_SECRET_FILE=$(mktemp "$SHARED_SECRET_DIR/.seafile-oauth.XXXXXX")
              # 32 random bytes become 64 ASCII hex characters, safely below
              # BCrypt's hard 72-byte input limit.
              openssl rand -hex 32 > "$TEMP_SECRET_FILE"
              ln "$TEMP_SECRET_FILE" "$SEAFILE_OAUTH_SECRET_FILE" 2>/dev/null || true
              rm -f "$TEMP_SECRET_FILE"
            fi
            test -s "$SEAFILE_OAUTH_SECRET_FILE"
            chmod 600 "$SEAFILE_OAUTH_SECRET_FILE"
            SEAFILE_OAUTH_CLIENT_SECRET=$(tr -d '\r\n' < "$SEAFILE_OAUTH_SECRET_FILE")
            # Migrate the former `openssl rand -hex 48` value (96 characters)
            # deterministically so the backend and Seafile workflows converge
            # on the same 256-bit secret even when they deploy concurrently.
            if [ "${#SEAFILE_OAUTH_CLIENT_SECRET}" -gt 72 ]; then
              SEAFILE_OAUTH_CLIENT_SECRET=$(printf '%s' "$SEAFILE_OAUTH_CLIENT_SECRET" | cut -c 1-64)
              TEMP_SECRET_FILE=$(mktemp "$SHARED_SECRET_DIR/.seafile-oauth.XXXXXX")
              printf '%s\n' "$SEAFILE_OAUTH_CLIENT_SECRET" > "$TEMP_SECRET_FILE"
              chmod 600 "$TEMP_SECRET_FILE"
              mv "$TEMP_SECRET_FILE" "$SEAFILE_OAUTH_SECRET_FILE"
              echo "Migrated shared Seafile OAuth secret to a BCrypt-compatible length"
            fi
            if [ "${#SEAFILE_OAUTH_CLIENT_SECRET}" -lt 32 ] || [ "${#SEAFILE_OAUTH_CLIENT_SECRET}" -gt 72 ]; then
              echo "Invalid shared Seafile OAuth secret" >&2
              exit 1
            fi
            
            # 从 GitHub Secrets 读取敏感环境变量并写入 .env 文件
            echo "# Redis 配置" > .env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST || '127.0.0.1' }}" >> .env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}" >> .env
            echo "REDIS_DATABASE=${{ secrets.REDIS_DATABASE || '0' }}" >> .env
            echo "" >> .env
            echo "# JWT / Sa-Token 配置" >> .env
            echo "SA_TOKEN_JWT_SECRET_KEY=${{ secrets.SA_TOKEN_JWT_SECRET_KEY }}" >> .env
            echo "SA_TOKEN_TIMEOUT=${{ secrets.SA_TOKEN_TIMEOUT || '2592000' }}" >> .env
            echo "" >> .env
            echo "# 数据库配置（生产环境）" >> .env
            echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
            echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
            echo "" >> .env
            echo "# AI 配置" >> .env
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
            echo "DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}" >> .env
            echo "DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" >> .env
            echo "" >> .env
            echo "# 机器人配置" >> .env
            echo "APP_BOT_CALLBACK_TOKEN=${{ secrets.APP_BOT_CALLBACK_TOKEN }}" >> .env
            echo "APP_NAPCAT_ACCESS_TOKEN=${{ secrets.APP_NAPCAT_ACCESS_TOKEN }}" >> .env
            echo "APP_NAPCAT_BASE_URL=${{ secrets.APP_NAPCAT_BASE_URL || 'http://127.0.0.1:3000' }}" >> .env
            echo "APP_BOT_LEAVE_REVIEW_CALLBACK_URL=${{ secrets.APP_BOT_LEAVE_REVIEW_CALLBACK_URL || 'http://127.0.0.1:6198/openatom/leave-review' }}" >> .env
            echo "" >> .env
            echo "# OIDC 配置" >> .env
            echo "VITE_OIDC_AUTHORITY=${{ secrets.VITE_OIDC_AUTHORITY || 'https://oauth.jmi-openatom.cn/api/v1' }}" >> .env
            echo "VITE_OIDC_CLIENT_ID=${{ secrets.VITE_OIDC_CLIENT_ID || 'openatom-web' }}" >> .env
            echo "APP_OIDC_ISSUER=${{ secrets.APP_OIDC_ISSUER || 'https://oauth.jmi-openatom.cn/api/v1' }}" >> .env
            echo "APP_OIDC_RESOURCE_AUDIENCE=${{ vars.APP_OIDC_RESOURCE_AUDIENCE || 'stalwart' }}" >> .env
            echo "APP_OIDC_KEY_ID=${{ vars.APP_OIDC_KEY_ID || 'openatom-oidc-rs256' }}" >> .env
            echo "APP_OIDC_PRIVATE_KEY_BASE64=${{ secrets.APP_OIDC_PRIVATE_KEY_BASE64 }}" >> .env
            echo "APP_OIDC_PUBLIC_KEY_BASE64=${{ secrets.APP_OIDC_PUBLIC_KEY_BASE64 }}" >> .env
            echo "APP_OIDC_PREVIOUS_KEY_ID=${{ vars.APP_OIDC_PREVIOUS_KEY_ID }}" >> .env
            echo "APP_OIDC_PREVIOUS_PUBLIC_KEY_BASE64=${{ secrets.APP_OIDC_PREVIOUS_PUBLIC_KEY_BASE64 }}" >> .env
            echo "APP_SEAFILE_OAUTH_CLIENT_SECRET=$SEAFILE_OAUTH_CLIENT_SECRET" >> .env
            echo "" >> .env
            echo "# 邮箱开通 Outbox" >> .env
            echo "APP_MAIL_PROVISION_URL=${{ vars.APP_MAIL_PROVISION_URL || 'http://127.0.0.1:18090/internal/v1/mailboxes/provision' }}" >> .env
            echo "APP_MAIL_SERVICE_TOKEN=${{ secrets.MAIL_INTERNAL_SERVICE_TOKEN }}" >> .env
            echo "" >> .env
            echo "# 文档中心（ONLYOFFICE）" >> .env
            echo "DOCUMENT_SERVER_OFFICE_URL=${{ vars.DOCUMENT_SERVER_OFFICE_URL || 'https://office.jmi-openatom.cn' }}" >> .env
            echo "DOCUMENT_SERVER_CALLBACK_BASE_URL=${{ vars.DOCUMENT_SERVER_CALLBACK_BASE_URL || 'https://api.jmi-openatom.cn/api/v1' }}" >> .env
            echo "DOCUMENT_SERVER_PUBLIC_API_BASE=${{ vars.DOCUMENT_SERVER_PUBLIC_API_BASE || 'https://api.jmi-openatom.cn/api/v1' }}" >> .env
            echo "DOCUMENT_SERVER_JWT_SECRET=${{ secrets.DOCUMENT_SERVER_JWT_SECRET }}" >> .env
            echo "" >> .env
            echo "# 第三方登录配置" >> .env
            echo "APP_GITHUB_CLIENT_ID=${{ secrets.APP_GITHUB_CLIENT_ID || 'Ov23liQQCxTjyoR8WAW9' }}" >> .env
            echo "APP_GITHUB_CLIENT_SECRET=${{ secrets.APP_GITHUB_CLIENT_SECRET }}" >> .env
            echo "APP_GITHUB_CALLBACK_URI=${{ secrets.APP_GITHUB_CALLBACK_URI || 'https://www.jmi-openatom.cn/auth/github/callback' }}" >> .env
            echo "APP_GITEE_CLIENT_ID=${{ secrets.APP_GITEE_CLIENT_ID || '12ed9f6f4df02c05cdf05045221e650e3bd3481f6301707a1d7ac8dd97211fa8' }}" >> .env
            echo "APP_GITEE_CLIENT_SECRET=${{ secrets.APP_GITEE_CLIENT_SECRET }}" >> .env
            echo "APP_GITEE_CALLBACK_URI=${{ secrets.APP_GITEE_CALLBACK_URI || 'https://www.jmi-openatom.cn/auth/gitee/callback' }}" >> .env
            echo "" >> .env
            echo "# 微信小程序配置" >> .env
            echo "APP_MINIAPP_APP_ID=${{ secrets.APP_MINIAPP_APP_ID }}" >> .env
            echo "APP_MINIAPP_APP_SECRET=${{ secrets.APP_MINIAPP_APP_SECRET }}" >> .env
            echo "" >> .env
            echo "# 文件存储路径（可选，默认使用容器内路径）" >> .env
            echo "APP_AVATAR_STORAGE_DIR=${{ secrets.APP_AVATAR_STORAGE_DIR || '/app/uploads/avatars' }}" >> .env
            echo "APP_IMAGE_HOSTING_STORAGE_DIR=${{ secrets.APP_IMAGE_HOSTING_STORAGE_DIR || '/app/uploads/images' }}" >> .env
            echo "APP_LEAVE_ATTACHMENT_STORAGE_DIR=${{ secrets.APP_LEAVE_ATTACHMENT_STORAGE_DIR || '/app/uploads/leave-attachments' }}" >> .env
            echo "APP_DOCUMENT_TEMPLATE_STORAGE_DIR=${{ secrets.APP_DOCUMENT_TEMPLATE_STORAGE_DIR || '/app/uploads/document-templates' }}" >> .env
            echo "APP_GENERATED_DOCUMENT_STORAGE_DIR=${{ secrets.APP_GENERATED_DOCUMENT_STORAGE_DIR || '/app/uploads/generated-documents' }}" >> .env
            
            echo ".env file created successfully."
            
            # 计算版本号
            BUILD_NUMBER="${{ github.run_number }}"
            SHORT_SHA=$(git rev-parse --short HEAD)
            PKG_VER=$(grep -oP '"version"\s*:\s*"\K[^"]+' frontend/web_pc/package.json || echo "1.0.0")
            APP_VER="v$PKG_VER.$BUILD_NUMBER-$SHORT_SHA"

            # Compose 会先完成镜像构建，再就地替换变化的容器。不要提前 down，
            # 否则整个构建期间 OAuth/API 都会返回 Nginx upstream unavailable。
            echo "Step 2: Building and rolling out version: $APP_VER"
            $COMPOSE_CMD pull astrbot napcat || true
            
            VITE_APP_VERSION=$APP_VER \
              VITE_API_BASE_URL=https://api.jmi-openatom.cn/api/v1 \
              $COMPOSE_CMD up -d --build --remove-orphans

            # 等待 Spring 完整启动，并验证 OAuth/OIDC 公开端点可用。
            # 仅检查 TCP 端口会在应用仍初始化时过早放行。
            OIDC_READY=false
            for attempt in $(seq 1 36); do
              OIDC_STATUS=$(curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                http://127.0.0.1:8921/api/v1/.well-known/openid-configuration || true)
              if [ "$OIDC_STATUS" = "200" ]; then
                OIDC_READY=true
                break
              fi
              sleep 5
            done

            if [ "$OIDC_READY" != "true" ]; then
              echo "Critical Error: OAuth/OIDC endpoint did not become ready within 180 seconds."
              $COMPOSE_CMD ps
              $COMPOSE_CMD logs --tail=200 backend
              exit 1
            fi

            AUTHORIZE_STATUS=$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --get http://127.0.0.1:8921/api/v1/oauth/authorize \
              --data-urlencode 'response_type=code' \
              --data-urlencode 'client_id=openatom-seafile' \
              --data-urlencode 'redirect_uri=https://cloud.jmi-openatom.cn/oauth/callback/' \
              --data-urlencode 'scope=openid profile email' \
              --data-urlencode 'state=deployment-health-check' || true)
            if [ "$AUTHORIZE_STATUS" != "302" ]; then
              echo "Critical Error: Seafile OAuth authorization endpoint returned HTTP $AUTHORIZE_STATUS; expected 302."
              $COMPOSE_CMD logs --tail=200 backend
              exit 1
            fi

            $COMPOSE_CMD ps

            for service in redis backend frontend astrbot napcat; do
              if ! $COMPOSE_CMD ps "$service" | grep -iq "Up"; then
                echo "Critical Error: Service $service is not running!"
                $COMPOSE_CMD logs --tail=100 "$service"
                exit 1
              fi
            done

            # The running containers protect their image layers. Reclaim only
            # dangling images and cap reusable BuildKit cache after a healthy rollout.
            # Never prune volumes here: they contain uploads and Redis data.
            docker image prune --force || true
            if docker builder prune --help 2>&1 | grep -q -- '--max-used-space'; then
              docker builder prune --force --max-used-space 5GB || true
            else
              docker builder prune --force --keep-storage 5GB || true
            fi
            echo "Deployment finished successfully."
