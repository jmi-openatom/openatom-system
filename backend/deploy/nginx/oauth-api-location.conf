# Included inside the existing oauth.jmi-openatom.cn server block by BaoTa.
# Keep OAuth API traffic off the frontend container and send it directly to
# the Spring Boot backend listening in host-network mode.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8921;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
