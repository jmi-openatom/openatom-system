# =============================================================================
# api.jmi-openatom.cn 入口 Nginx 配置片段（负载均衡 + 公开接口缓存 + 优化）
#
# 部署方式：合并到宝塔站点配置的 server 块中（或 include 本文件）。
# 使用前确认：
#   1. backend 双副本已部署（docker compose up -d），8921/8922 均在监听；
#   2. proxy_cache_path 的目录可写（如 /www/server/nginx-cache/openatom）；
#   3. 若宝塔 Nginx 已编译 ngx_brotli 模块，可取消 brotli 段注释。
# =============================================================================

# ---- HTTP 层优化（server 块外）----
# 启用 HTTP/2（需要 TLS 站点，宝塔 SSL 开启后自动生效；旧版 nginx 用
#   listen 443 ssl http2;  新版 1.25.1+ 用   listen 443 ssl; http2 on;）
# http2 on;

# Brotli（需 ngx_brotli 模块，宝塔应用商店安装 Brotli 扩展后可用）
# brotli on;
# brotli_comp_level 6;
# brotli_static on;
# brotli_types text/plain text/css application/json application/javascript
#            application/xml text/javascript image/svg+xml font/woff2;

# ---- 公开接口缓存目录（server 块外，仅定义一次）----
proxy_cache_path /www/server/nginx-cache/openatom levels=1:2
                 keys_zone=openatom_api:32m inactive=10m max_size=256m;
proxy_cache_key "$scheme$request_method$host$request_uri";

# ---- 后端负载均衡（server 块外）----
upstream openatom_api {
    server 127.0.0.1:8921 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8922 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

