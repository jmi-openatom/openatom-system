<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">江苏海事职业技术学院开放原子开源社团社团管理系统标志</title>
  <desc id="desc">由海事船锚、原子轨道、协作节点和海浪构成的 OpenAtom System 产品标志。</desc>
  <rect width="2400" height="800" rx="72" fill="#FFFFFF"/>
  <image href="openatom-system-logo-mark.png" x="64" y="64" width="672" height="672" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="790" y="235" fill="#6E6E73" font-size="52" font-weight="500" letter-spacing="5">江苏海事职业技术学院</text>
    <text x="786" y="385" fill="#0A4B78" font-size="112" font-weight="700" letter-spacing="2">开放原子开源社团</text>
    <line x1="790" y1="448" x2="2215" y2="448" stroke="#D2D2D7" stroke-width="3"/>
    <text x="790" y="560" fill="#1D1D1F" font-size="68" font-weight="600" letter-spacing="12">社团管理系统</text>
    <text x="794" y="645" fill="#1677FF" font-size="32" font-weight="600" letter-spacing="8">JMI-OPENATOM · OPENATOM SYSTEM</text>
  </g>
</svg>
