global:
  resolve_timeout: 5m
  smtp_smarthost: stalwart:25
  smtp_from: alertmanager@localhost
  smtp_require_tls: false

route:
  receiver: mail-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: mail-operations
    email_configs:
      - to: postmaster@jmi-openatom.cn
        send_resolved: true
