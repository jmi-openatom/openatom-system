# Rendered at container start from environment; do not edit inside the container.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.resend.com:465
  smtp_from: alertmanager@mailer.jmi-openatom.cn
  smtp_auth_username: __RESEND_SMTP_USERNAME__
  smtp_auth_password: __RESEND_SMTP_PASSWORD__
  smtp_require_tls: true

route:
  receiver: mail-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: mail-operations
    email_configs:
      - to: __ALERT_RECIPIENT__
        send_resolved: true