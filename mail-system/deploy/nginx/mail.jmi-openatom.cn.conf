server {
    listen 80;
    listen [::]:80;
    server_name mail.jmi-openatom.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name mx1.jmi-openatom.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name mta-sts.jmi-openatom.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mta-sts.jmi-openatom.cn;

    ssl_certificate /etc/letsencrypt/live/openatom-mail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openatom-mail/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /.well-known/mta-sts.txt {
        alias __OPENATOM_REPOSITORY_ROOT__/mail-system/deploy/dns/mta-sts.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / { return 404; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.jmi-openatom.cn;

    ssl_certificate /etc/letsencrypt/live/openatom-mail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openatom-mail/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MailSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
